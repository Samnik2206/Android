name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/speakly-release.jks

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.PLAY_RELEASE_STORE_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=app/speakly-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=speakly_release_key
          keyPassword=$STORE_PASSWORD
          EOF

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: speakly-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: speakly-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
